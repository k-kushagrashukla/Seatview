<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Seatview: pick your seat, see your view</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600;9..144,800&family=DM+Sans:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#160f17;--panel:#21161f;--line:#3a2a37;--velvet:#8e2a3c;--brass:#e0b567;--glow:#bfe0ff;--text:#f1e9e4;--mute:#a89aa3;color-scheme:dark;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*,*::before,*::after{box-sizing:inherit}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--text);font:400 15px/1.5 "DM Sans",system-ui,sans-serif}
button{font:inherit;color:inherit;cursor:pointer}
header{padding:22px clamp(16px,4vw,40px) 16px;display:flex;flex-wrap:wrap;align-items:baseline;gap:6px 22px}
h1,h2{font-family:Fraunces,Georgia,serif;margin:0;letter-spacing:-.01em}
h1{font-size:clamp(1.7rem,3.4vw,2.6rem);font-weight:800}
header span{color:var(--mute)}
.app{display:grid;grid-template-columns:minmax(0,1fr) 400px;gap:20px;padding:0 clamp(16px,4vw,40px) 40px}
@media(max-width:920px){.app{grid-template-columns:1fr}}
#stage{position:relative;height:min(70vh,660px);min-height:340px;border-radius:18px;overflow:hidden;background:#0a060b;border:1px solid var(--line)}
@media(max-width:920px){#stage{height:52vh}}
#stage canvas{display:block;width:100%;height:100%}
.hud{position:absolute;left:14px;right:14px;bottom:14px;display:flex;justify-content:space-between;align-items:flex-end;gap:12px;pointer-events:none;flex-wrap:wrap}
.card{background:rgba(22,15,23,.84);backdrop-filter:blur(8px);border:1px solid var(--line);border-radius:12px;padding:12px 14px}
.card h2{font-size:1.3rem;font-weight:600}
.card small{color:var(--mute)}
.stats{display:flex;gap:18px;margin-top:8px;font-size:13px}
.stats b{display:block;font-size:1.15rem;color:var(--brass);font-weight:700}
#toggle{position:absolute;top:14px;right:14px;background:rgba(22,15,23,.84);border:1px solid var(--line);border-radius:999px;padding:8px 16px}
#toggle:hover{border-color:var(--brass)}
.tip{font-size:12px;color:var(--mute);max-width:190px}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:18px;padding:18px;align-self:start}
.screenbar{height:12px;border-radius:60% 60% 0 0/100% 100% 0 0;background:linear-gradient(var(--glow),transparent);opacity:.75}
.screenlbl{text-align:center;font-size:12px;color:var(--mute);margin:4px 0 12px}
.row{display:flex;gap:4px;align-items:center;margin-bottom:4px}
.rl{width:14px;font-size:12px;color:var(--mute);text-align:center}
.aisle{flex:0 0 14px}
.seat{flex:1;min-width:0;aspect-ratio:1;border:0;border-radius:7px 7px 3px 3px;padding:0;background:#4a3a45;transition:transform .12s}
.seat[data-t="1"]{background:#7a6030}.seat[data-t="2"]{background:#5b4a78}
.seat:hover:not(:disabled){transform:translateY(-2px)}
.seat:focus-visible{outline:2px solid var(--glow);outline-offset:2px}
.seat:disabled{background:#2a1f27;opacity:.45;cursor:not-allowed}
.seat.sel{background:var(--brass)!important;box-shadow:0 0 0 2px #fff3 }
.legend{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:12px;color:var(--mute);margin:14px 0}
.legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:5px;vertical-align:-1px}
.sum{border-top:1px solid var(--line);padding-top:14px}
.chips{display:flex;flex-wrap:wrap;gap:6px;min-height:30px;margin-bottom:12px}
.chip{background:#0004;border:1px solid var(--line);border-radius:8px;padding:3px 10px;font-size:13px}
#cta{width:100%;border:0;border-radius:12px;padding:13px;font-weight:700;background:var(--brass);color:#1a1013}
#cta:disabled{background:#3a2a37;color:var(--mute);cursor:not-allowed}
#msg{font-size:12px;color:var(--mute);min-height:18px;margin:8px 0 0}
#ov{position:fixed;inset:0;background:rgba(10,6,11,.86);display:none;place-items:center;padding:20px;z-index:20}
#ov.on{display:grid}
.ticket{background:var(--panel);border:1px solid var(--brass);border-radius:18px;padding:26px;max-width:380px;width:100%;text-align:center}
.ticket h2{font-size:2rem;font-weight:800}
.ticket .big{font-family:Fraunces,Georgia,serif;font-size:1.6rem;color:var(--brass);margin:10px 0}
.ticket button{margin-top:14px;background:none;border:1px solid var(--line);border-radius:10px;padding:10px 16px}
@media(prefers-reduced-motion:reduce){.seat{transition:none}}
</style></head>
<body>
<header><h1>Monsoon Express</h1><span>Hall 2</span><span>Today, 7:30 PM</span><span>Hindi, 2h 08m</span></header>
<main class="app">
  <section id="stage" aria-label="3D view from the selected seat">
    <button id="toggle" type="button">See the whole hall</button>
    <div class="hud">
      <div class="card" aria-live="polite"><h2 id="vSeat"></h2><small id="vTier"></small>
        <div class="stats"><div><b id="vFov"></b>screen width</div><div><b id="vAhead"></b>taken seats just ahead</div></div>
        <small id="vVerdict"></small></div>
      <div class="tip">Move your pointer over the view to look around.</div>
    </div>
  </section>
  <aside class="panel">
    <div class="screenbar"></div><div class="screenlbl">Screen</div>
    <div id="map" role="group" aria-label="Seat map"></div>
    <div class="legend"><span><i style="background:#4a3a45"></i>Front ₹180</span><span><i style="background:#7a6030"></i>Prime ₹300</span><span><i style="background:#5b4a78"></i>Recliner ₹240</span><span><i style="background:var(--brass)"></i>Yours</span><span><i style="background:#2a1f27"></i>Taken</span></div>
    <div class="sum"><div class="chips" id="chips"></div><button id="cta" type="button" disabled>Pick a seat to continue</button><p id="msg">Hover or tap any seat to see what you’ll see.</p></div>
  </aside>
</main>
<div id="ov" role="dialog" aria-modal="true"></div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
const ROWS='ABCDEFGH'.split(''),COLS=12,AISLE=6,PITCH=1.1,STEP=.3,Z0=7,SW=.62,GAP=.9,SCR_W=11.5,SCR_H=SCR_W/2.39;
const price=r=>r<2?180:r<6?300:240,tier=r=>r<2?0:r<6?1:2,tierName=['Front rows','Prime','Recliner'];
const seatX=c=>(c-(COLS-1)/2)*SW+(c>=AISLE?GAP/2:-GAP/2),seatZ=r=>Z0+r*PITCH,rise=r=>r*STEP+.2;
const k=(r,c)=>r+'-'+c,rnd=i=>{const x=Math.sin(i*127.1+311.7)*43758.5453;return x-Math.floor(x)};
const $=s=>document.querySelector(s),reduce=matchMedia('(prefers-reduced-motion:reduce)').matches;
const sold=new Set();ROWS.forEach((_,r)=>{for(let c=0;c<COLS;c++)if(rnd(r*31+c+7)<.3)sold.add(k(r,c))});sold.delete(k(3,5));sold.delete(k(3,6));
let sel=[],hover=null,mode='seat';

/* 3D scene */
const stage=$('#stage'),renderer=new THREE.WebGLRenderer({antialias:true});renderer.setPixelRatio(Math.min(devicePixelRatio,2));stage.prepend(renderer.domElement);
const scene=new THREE.Scene();scene.background=new THREE.Color(0x0a060b);scene.fog=new THREE.Fog(0x0a060b,14,38);
const cam=new THREE.PerspectiveCamera(70,1,.1,60);
scene.add(new THREE.AmbientLight(0x7a6070,.8));
const glow=new THREE.PointLight(0xbfe0ff,1.3,40);glow.position.set(0,3.9,2.5);scene.add(glow);
const M=(c,r=1)=>new THREE.MeshStandardMaterial({color:c,roughness:r}),B=(w,h,d,m,x,y,z)=>{const o=new THREE.Mesh(new THREE.BoxGeometry(w,h,d),m);o.position.set(x,y,z);scene.add(o);return o};
const carpet=M(0x3b1420),wall=M(0x1d1220),dark=M(0x120c14),amber=new THREE.MeshBasicMaterial({color:0xffb25a});
B(13,.2,6,carpet,0,.1,3.5);
ROWS.forEach((_,r)=>{B(13,rise(r),PITCH,carpet,0,rise(r)/2,seatZ(r));B(13,.03,.03,amber,0,rise(r)-.02,seatZ(r)-PITCH/2)});
[-6.6,6.6].forEach(x=>{B(.2,9.4,22,wall,x,4.7,7);for(let i=0;i<12;i++)B(.1,6,.4,M(0x2a1a2c),x*.985,4.2,i*1.8-3)});
B(13.4,.2,22,wall,0,9.4,7);B(SCR_W+.5,SCR_H+.5,.1,dark,0,1.5+SCR_H/2,-.06);
[-1,1].forEach(s=>B(1.1,6.4,.4,M(0x8e2a3c),s*(SCR_W/2+.9),3.8,.1));
const sc=document.createElement('canvas');sc.width=1024;sc.height=428;const g=sc.getContext('2d'),tex=new THREE.CanvasTexture(sc);
const screen=new THREE.Mesh(new THREE.PlaneGeometry(SCR_W,SCR_H),new THREE.MeshBasicMaterial({map:tex,toneMapped:false}));screen.position.set(0,1.5+SCR_H/2,0);scene.add(screen);
function paint(t){
  const sky=g.createLinearGradient(0,0,0,300);sky.addColorStop(0,'#1b2a4a');sky.addColorStop(1,'#e58b5a');g.fillStyle=sky;g.fillRect(0,0,1024,428);
  g.fillStyle='#ffd9a0';g.beginPath();g.arc(620+Math.sin(t*.2)*60,235,46,0,7);g.fill();
  g.fillStyle='#1a1424';g.beginPath();g.moveTo(0,428);g.lineTo(0,290);g.quadraticCurveTo(250,230,520,300);g.quadraticCurveTo(800,240,1024,290);g.lineTo(1024,428);g.fill();
  const x=((t*110)%1700)-500;g.fillStyle='#0b0810';for(let i=0;i<7;i++){g.fillRect(x+i*128,300,120,52);g.fillStyle='#ffd27a';for(let j=0;j<3;j++)g.fillRect(x+i*128+14+j*34,314,20,14);g.fillStyle='#0b0810'}
  g.fillRect(0,352,1024,76);g.strokeStyle='rgba(255,255,255,.28)';g.lineWidth=1.5;g.beginPath();
  for(let i=0;i<90;i++){const rx=(i*47+t*70)%1100-40,ry=(i*83+t*420)%428;g.moveTo(rx,ry);g.lineTo(rx-6,ry+18)}g.stroke();
  g.font='600 26px serif';g.textAlign='center';g.fillStyle='#fff';g.shadowColor='#000';g.shadowBlur=8;g.fillText('“We won’t make the last train.”',512,398);g.shadowBlur=0;tex.needsUpdate=true}

const gB=new THREE.BoxGeometry(.5,.12,.5),gK=new THREE.BoxGeometry(.5,.62,.1),gP=new THREE.BoxGeometry(.18,.4,.18),gH=new THREE.SphereGeometry(.13,12,10),gS=new THREE.BoxGeometry(.4,.55,.22);
const seats=ROWS.map(()=>[]);
function person(r,c){const x=seatX(c)+(rnd(r*9+c)-.5)*.12,y=rise(r),z=seatZ(r)+.08,h=(rnd(r*5+c*3)-.5)*.14;
  [[gH,x,y+1.12+h],[gS,x,y+.8]].forEach(([ge,px,py])=>{const o=new THREE.Mesh(ge,dark);o.position.set(px,py,z);scene.add(o)})}
ROWS.forEach((_,r)=>{for(let c=0;c<COLS;c++){const m=M(0x8e2a3c,.85),x=seatX(c),y=rise(r),z=seatZ(r);
  [[gB,y+.45,z],[gK,y+.78,z+.22],[gP,y+.2,z]].forEach(([ge,py,pz],i)=>{const o=new THREE.Mesh(ge,i==2?dark:m);o.position.set(x,py,pz);scene.add(o)});
  seats[r][c]=m;if(sold.has(k(r,c)))person(r,c)}});

const pos=new THREE.Vector3(0,3,18),tgt=new THREE.Vector3(0,3.7,0),pT=pos.clone(),tT=tgt.clone(),look={x:0,y:0,sx:0,sy:0};
stage.addEventListener('pointermove',e=>{const b=stage.getBoundingClientRect();look.x=((e.clientX-b.left)/b.width-.5)*2;look.y=-((e.clientY-b.top)/b.height-.5)*2});
stage.addEventListener('pointerleave',()=>{look.x=look.y=0});
function size(){const w=stage.clientWidth,h=stage.clientHeight;renderer.setSize(w,h);cam.aspect=w/h;cam.updateProjectionMatrix()}
new ResizeObserver(size).observe(stage);size();
function frame(ms){const t=ms/1000,f=reduce?1:.07;paint(reduce?0:t);pos.lerp(pT,f);tgt.lerp(tT,f);
  look.sx+=(look.x-look.sx)*.08;look.sy+=(look.y-look.sy)*.08;cam.position.copy(pos);
  cam.lookAt(tgt.x+(mode=='seat'?look.sx*2.2:0),tgt.y+(mode=='seat'?look.sy*1.2:0),tgt.z);
  glow.intensity=1.25+(reduce?0:Math.sin(t*1.7)*.15);renderer.render(scene,cam);requestAnimationFrame(frame)}
requestAnimationFrame(frame);

/* UI */
const cur=()=>hover||(sel.length?sel[sel.length-1]:[3,5]);
function updateView(){const [r,c]=cur(),x=seatX(c),z=seatZ(r),d=Math.hypot(x,z),fov=Math.round(2*Math.atan(SCR_W/2/d)*180/Math.PI);
  $('#vSeat').textContent='Row '+ROWS[r]+', seat '+(c+1);$('#vTier').textContent=tierName[tier(r)]+', ₹'+price(r);
  $('#vFov').textContent=fov+'°';let n=0;for(let rr=r-2;rr<r;rr++)for(let cc=c-1;cc<=c+1;cc++)if(sold.has(k(rr,cc)))n++;$('#vAhead').textContent=n;
  $('#vVerdict').textContent=fov>=65?'Very close, you’ll be looking up.':fov>=50?'Immersive, the screen fills your view.':fov>=38?'Comfortable, easy on the neck.':'Far back, the screen feels small.';
  if(mode=='seat'){pT.set(x,rise(r)+1.15,z+.05);tT.set(x*.3,3.6,0)}else{pT.set(0,7.6,23);tT.set(0,2.2,6)}
  $('#toggle').textContent=mode=='seat'?'See the whole hall':'Back to seat view';
  ROWS.forEach((_,rr)=>seats[rr].forEach((m,cc)=>{const s=sel.some(a=>a[0]==rr&&a[1]==cc);m.color.setHex(s?0xe0b567:0x8e2a3c);m.emissive.setHex(mode=='over'&&rr==r&&cc==c?0x664422:0)}))}
const mapEl=$('#map');
ROWS.forEach((L,r)=>{const row=document.createElement('div');row.className='row';row.innerHTML='<span class="rl">'+L+'</span>';
  for(let c=0;c<COLS;c++){if(c==AISLE){const a=document.createElement('span');a.className='aisle';row.append(a)}
    const b=document.createElement('button');b.type='button';b.className='seat';b.dataset.t=tier(r);b.dataset.k=k(r,c);
    b.setAttribute('aria-label','Row '+L+', seat '+(c+1)+', ₹'+price(r)+(sold.has(k(r,c))?', taken':''));b.disabled=sold.has(k(r,c));
    const prev=()=>{hover=[r,c];mode='seat';updateView()},unprev=()=>{hover=null;updateView()};
    b.addEventListener('pointerenter',prev);b.addEventListener('focus',prev);b.addEventListener('pointerleave',unprev);b.addEventListener('blur',unprev);
    b.addEventListener('click',()=>{const i=sel.findIndex(a=>a[0]==r&&a[1]==c);
      if(i>=0)sel.splice(i,1);else if(sel.length>=6){$('#msg').textContent='You can book up to 6 seats at once.';return}else sel.push([r,c]);
      b.classList.toggle('sel',i<0);renderSum();updateView()});
    row.append(b)}mapEl.append(row)});
function renderSum(){const total=sel.reduce((s,[r])=>s+price(r),0);
  $('#chips').innerHTML=sel.map(([r,c])=>'<span class="chip">'+ROWS[r]+(c+1)+' ₹'+price(r)+'</span>').join('');
  const b=$('#cta');b.disabled=!sel.length;b.textContent=sel.length?'Book '+sel.length+' seat'+(sel.length>1?'s':'')+' for ₹'+total:'Pick a seat to continue';
  $('#msg').textContent=sel.length?'Seats are held for 5 minutes after you book.':'Hover or tap any seat to see what you’ll see.'}
$('#toggle').addEventListener('click',()=>{mode=mode=='seat'?'over':'seat';updateView()});
$('#cta').addEventListener('click',()=>{const total=sel.reduce((s,[r])=>s+price(r),0),id='SV'+Math.random().toString(36).slice(2,7).toUpperCase(),lbl=sel.map(([r,c])=>ROWS[r]+(c+1)).join(', ');
  $('#ov').innerHTML='<div class="ticket"><h2>You’re in.</h2><p>Monsoon Express, Hall 2<br>Today, 7:30 PM</p><div class="big">'+lbl+'</div><p>Booking '+id+', total ₹'+total+'</p><button id="again" type="button">Pick other seats</button></div>';
  $('#ov').classList.add('on');$('#again').focus();
  sel.forEach(([r,c])=>{sold.add(k(r,c));person(r,c);const b=document.querySelector('[data-k="'+k(r,c)+'"]');b.classList.remove('sel');b.disabled=true});
  sel=[];renderSum();updateView();$('#again').addEventListener('click',()=>$('#ov').classList.remove('on'))});
renderSum();updateView();
</script>
</body></html>
